# HestiaPi 3.5" ILI9486 SPI LCD, exposed by fbtft as /dev/fb1
# (480x320, 16bpp).  The display is not a KMS/DRM device, so it needs the
# fbdev driver.  fbdev requires an explicit BusID when another framebuffer
# (the HDMI output) is present.

Section "Device"
    Identifier  "kiosk"
    Driver      "fbdev"
    BusID       "spi1.0"
    Option      "fbdev" "/dev/fb1"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU"  "false"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection
